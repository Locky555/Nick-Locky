<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BCIS Course Advisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f0f0f0;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    #chat-container {
      width: 360px;
      height: 600px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #fafafa;
    }
    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.35;
      white-space: pre-wrap;      /* preserve newlines from server */
      overflow-wrap: anywhere;    /* wrap long tokens */
    }
    .user {
      align-self: flex-end;
      background: #e67002;
      color: #fff;
      border-bottom-right-radius: 6px;
    }
    .bot {
      align-self: flex-start;
      background: #e5e5ea;
      color: #111;
      border-bottom-left-radius: 6px;
    }
    #input-box {
      display: flex;
      border-top: 1px solid #e5e5ea;
      background: #fff;
    }
    #user-input {
      flex: 1;
      border: 0;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }
    #send-button {
      border: 0;
      padding: 0 16px;
      background: #ff6600f0;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #send-button:disabled { opacity: .6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="messages"></div>
    <div id="input-box">
      <input id="user-input" placeholder="e.g. software development courses year 2" />
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const messagesDiv = document.getElementById('messages');

    function appendMessage(text, who) {
      const el = document.createElement('div');
      el.className = `message ${who}`;
      el.textContent = text;
      messagesDiv.appendChild(el);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return el;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      appendMessage(message, 'user');
      input.value = '';
      sendButton.disabled = true;
      const placeholder = appendMessage('…', 'bot');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        placeholder.textContent = data.response || '(no response)';
      } catch (e) {
        placeholder.textContent = 'Error contacting server.';
        console.error(e);
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    // greet
    appendMessage('Hi! Im your A.I BCIS Course Advisor\nAsk me about\n- Specific course info eg. comp503\n- Prereqisites\n- Major papers', 'bot');
  </script>
</body>
</html>
